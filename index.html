<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Same source artwork as the Tauri desktop build's icon, generated alongside the PWA icon
         set (see scripts/generate-pwa-icons.mjs) rather than reused as a raw .ico — PNG is fully
         supported by every evergreen browser and needed the same solid-background/rounded-corner
         treatment the PWA icons got (a transparent favicon can disappear against a similarly
         colored browser tab background, same bug that prompted this whole icon pass). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Worship Studio</title>
    <!-- Tablet (PWA) build only meaningfully reads these, but they're harmless everywhere else
         — see scripts/generate-pwa-icons.mjs and public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#151b23" />
    <!-- iOS ignores manifest.webmanifest's display:"standalone" — these are what actually make
         "Add to Home Screen" launch without Safari's chrome there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Worship Studio" />
    <!-- Matches the splash window's native background_color (src-tauri/src/lib.rs) and
         SplashScreen.vue's .splash-bg — set synchronously here so there's no default-white
         paint in the gap between this raw HTML parsing and Vue mounting/applying its own CSS. -->
    <style>
      html,
      body {
        background: #151b23;
        height: 100%;
        /* The tablet build's whole layout scrolls inside <v-main scrollable> (see App.vue) —
             the document itself must never become a second scrolling context, or iOS Safari's
             elastic overscroll on it drags the (absolutely-positioned-within-the-document)
             app-bar along for the ride, momentarily exposing page content above it into the
             physical status-bar area. */
        overflow: hidden;
      }
      /* iOS ignores manifest.webmanifest's display:"standalone" — apple-mobile-web-app-*
           above are what actually go full-bleed under the status bar/home indicator in an
           installed PWA, so viewport-fit=cover + this padding are both needed together to
           actually clear those regions rather than just visually match them. */
      #app {
        box-sizing: border-box;
        height: 100%;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
