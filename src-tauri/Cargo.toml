[package]
name = "worship-studio"
version = "0.1.0"
description = "Worship Studio — church presentation/service management app"
authors = ["Jason Yeager"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "worship_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
gethostname = "1.1.0"
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"
