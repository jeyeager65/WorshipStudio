[package]
name = "worship-studio"
version = "0.9.0"
description = "Worship Studio — church presentation/service management app"
authors = ["Jason Yeager"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "worship_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
gethostname = "1.1.0"
tauri-plugin-dialog = "2.7.2"
# Filesystem watching for the library folder, so the running app notices a tablet's edit arriving
# through the cloud client rather than needing a restart (src/library_watch.rs).
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
raw-window-handle = "0.6"
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
base64 = "0.23.0"
qrcode = "0.14.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
mdns-sd = "0.20.2"
rust-embed = "8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# External App Hand-off (design/feature-spec.md section 12) is explicitly Windows-only —
# foreground-window switching, positioning, and keystroke injection have no macOS/Linux
# equivalent this app needs, so the FFI bindings are gated to that target rather than pulled
# into every build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.27.0"
