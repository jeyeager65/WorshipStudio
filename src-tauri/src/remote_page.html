<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Worship Studio Remote</title>
<style>
  :root {
    --bg: #11131a;
    --panel: #1c1f29;
    --border: #2c303c;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --accent: #5b7cfa;
    --live-red: #e6534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .header .brand { font-size: 14px; font-weight: 700; color: var(--muted); }
  .connection-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3ecf6d;
    display: inline-block;
    margin-right: 5px;
  }
  .connection-dot.offline { background: var(--live-red); }

  /* The confidence-monitor mirror (feature-spec.md section 4): always Contain-fit, never
     Cover — the opposite default from background media on the real audience display, since
     the mirror's whole purpose is accurately showing what the congregation actually sees,
     not filling this device's own screen. */
  .mirror-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .mirror {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    padding: 16px;
  }
  .mirror img, .mirror video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .mirror-empty { color: var(--muted); font-size: 13px; }
  .mirror-label {
    font-size: clamp(11px, 3vw, 16px);
    opacity: 0.65;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .mirror-text { font-size: clamp(14px, 4vw, 26px); font-weight: 600; line-height: 1.3; white-space: pre-line; }
  .mirror-countdown { font-size: clamp(28px, 10vw, 56px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .wayfinding-content { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wayfinding-book { font-weight: 600; letter-spacing: 0.03em; }
  .wayfinding-reference { font-size: clamp(20px, 6vw, 40px); font-weight: 700; margin: 6px 0; }
  .mirror-scene { position: absolute; inset: 0; overflow: hidden; text-align: initial; }
  .mirror-scene-element { position: absolute; transform-origin: center; overflow: hidden; }
  .mirror-scene-text { display: flex; width: 100%; height: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mirror-scene-element img { width: 100%; height: 100%; display: block; }

  /* Prev/Next (+ Start/Stop Presenting) overlaid on top of the mirror per the device's access
     level, matching feature-spec.md's "control-capable levels get the overlay too" — not a
     separate section below it. */
  .mirror-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 10px;
    pointer-events: none;
  }
  .overlay-row { display: flex; gap: 8px; width: 100%; pointer-events: auto; }
  .overlay-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 10px;
    border: none;
    background: rgba(28, 31, 41, 0.82);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .overlay-btn.next { background: rgba(91, 124, 250, 0.88); }
  .overlay-btn.present { background: rgba(230, 83, 79, 0.88); flex: 0 0 auto; padding: 10px 14px; }

  .live-status-row {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .live-blink { width: 7px; height: 7px; border-radius: 50%; background: var(--live-red); flex-shrink: 0; }
  .access-note { text-align: center; font-size: 11px; color: var(--muted); padding: 16px 18px; }
</style>
</head>
<body>
  <div class="header">
    <span class="brand">Worship Studio Remote</span>
    <span><span id="connection-dot" class="connection-dot"></span><span id="device-name" class="muted"></span></span>
  </div>

  <div class="live-status-row">
    <span id="live-blink" class="live-blink" style="visibility: hidden"></span>
    <span id="live-status-text">Not presenting</span>
  </div>

  <div class="mirror-wrap">
    <div class="mirror" id="mirror"><div class="mirror-empty">Not presenting</div></div>
    <div class="mirror-overlay">
      <div class="overlay-row" id="transport-row" style="display:none">
        <button type="button" class="overlay-btn" id="prev-btn">&lsaquo; Previous</button>
        <button type="button" class="overlay-btn next" id="next-btn">Next &rsaquo;</button>
        <button type="button" class="overlay-btn present" id="present-btn" style="display:none">&#9632;/&#9654;</button>
      </div>
    </div>
  </div>

  <div class="access-note" id="access-note"></div>

  <script>
    const ACCESS_LABELS = {
      'view-only': 'View Only — mirrors the presentation screen only',
      'advance-only': 'Advance Only — reordering and editing require the operator computer',
      'full-control': 'Full Control — content editing still requires the operator computer',
    };

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : value;
      return div.innerHTML;
    }

    async function postAction(action, extra) {
      await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ action }, extra || {})),
      });
    }
    document.getElementById('prev-btn').addEventListener('click', () => postAction('previous'));
    document.getElementById('next-btn').addEventListener('click', () => postAction('next'));
    document.getElementById('present-btn').addEventListener('click', () => postAction('toggle-presenting'));

    // Countdown items tick locally every second (spec section 1), independent of the ~1.2s
    // state poll below — same reasoning as the operator app's own separate ticking clock.
    let countdownTarget = null;
    function formatCountdown(targetTime, now) {
      const target = new Date(targetTime);
      const totalSeconds = Math.max(0, Math.floor((target.getTime() - now.getTime()) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return hours > 0 ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(minutes)}:${pad(seconds)}`;
    }
    setInterval(() => {
      if (!countdownTarget) return;
      const el = document.getElementById('mirror-countdown');
      if (el) el.textContent = formatCountdown(countdownTarget, new Date());
    }, 1000);

    // Mirrors PresentationView.vue's own rendering branches (wayfinding / media / countdown /
    // plain text) — this is a separate, vanilla-JS implementation (no build step for a page
    // served straight from Rust), not a shared component with the Vue app.
    function renderMirror(isPresenting, content) {
      const mirror = document.getElementById('mirror');
      countdownTarget = null;

      if (!isPresenting || !content) {
        mirror.innerHTML = `<div class="mirror-empty">${isPresenting ? 'Live — nothing on screen yet' : 'Not presenting'}</div>`;
        return;
      }
      if (content.scene) {
        renderScene(mirror, content.scene);
        return;
      }
      if (content.wayfindingBooks) {
        const bookHtml = (b) => `<div class="wayfinding-book" style="${bookStyle(b.distance)}">${escapeHtml(b.name)}</div>`;
        const before = content.wayfindingBooks.filter((b) => b.distance < 0).map(bookHtml).join('');
        const after = content.wayfindingBooks.filter((b) => b.distance > 0).map(bookHtml).join('');
        mirror.innerHTML = `<div class="wayfinding-content">${before}<div class="wayfinding-reference">${escapeHtml(content.itemLabel)}</div>${after}</div>`;
        return;
      }
      if (content.media && content.media.kind === 'image') {
        mirror.innerHTML = `<img src="/api/media/${encodeURIComponent(content.media.mediaId)}" alt="" />`;
        return;
      }
      if (content.media && content.media.kind === 'video') {
        // Muted: mobile browsers block non-muted autoplay, and this is a visual mirror, not
        // an audio source — the room's own sound system already carries the real audio.
        mirror.innerHTML = `<video src="/api/media/${encodeURIComponent(content.media.mediaId)}" autoplay muted playsinline loop></video>`;
        return;
      }
      if (content.countdown) {
        const label = content.countdown.text ? `<div class="mirror-label">${escapeHtml(content.countdown.text)}</div>` : '';
        mirror.innerHTML = `${label}<div class="mirror-countdown" id="mirror-countdown">${formatCountdown(content.countdown.targetTime, new Date())}</div>`;
        countdownTarget = content.countdown.targetTime;
        return;
      }
      const sub = content.subLabel ? ` — ${escapeHtml(content.subLabel)}` : '';
      mirror.innerHTML = `<div><div class="mirror-label">${escapeHtml(content.itemLabel)}${sub}</div><div class="mirror-text">${escapeHtml(content.text)}</div></div>`;
    }

    function renderScene(mirror, scene) {
      const pct = (value, total) => `${(Number(value || 0) / Number(total || 1)) * 100}%`;
      const background = scene.background || {};
      const backgroundImage = background.mediaId
        ? `background-image:url('/api/media/${encodeURIComponent(background.mediaId)}');`
        : '';
      const backgroundStyle = `background-color:${escapeHtml(background.color || '#000')};${backgroundImage}background-size:${background.fit === 'contain' ? 'contain' : 'cover'};background-repeat:no-repeat;background-position:${Number(background.focalPoint?.x ?? .5) * 100}% ${Number(background.focalPoint?.y ?? .5) * 100}%;`;
      const elements = (scene.elements || []).filter((element) => !element.hidden).map((element) => {
        const base = `left:${pct(element.x, scene.width)};top:${pct(element.y, scene.height)};width:${pct(element.width, scene.width)};height:${pct(element.height, scene.height)};transform:rotate(${Number(element.rotation || 0)}deg);opacity:${Number(element.opacity ?? 1)};`;
        if (element.type === 'text') {
          const style = element.style || {};
          const align = ['left', 'center', 'right'].includes(style.textAlign) ? style.textAlign : 'center';
          const vertical = style.verticalAlign === 'top' ? 'flex-start' : style.verticalAlign === 'bottom' ? 'flex-end' : 'center';
          const effect = style.effect || {};
          const effectSize = pct(effect.size || 4, scene.height).replace('%', 'cqh');
          const effectColor = escapeHtml(effect.color || '#000');
          const textShadow = effect.type === 'outline'
            ? `0 0 ${effectSize} ${effectColor},0 0 ${effectSize} ${effectColor}`
            : effect.type === 'glow'
              ? `0 0 ${pct((effect.size || 4) * 2, scene.height).replace('%', 'cqh')} ${effectColor},0 0 ${pct((effect.size || 4) * 3, scene.height).replace('%', 'cqh')} ${effectColor}`
              : effect.type === 'shadow'
                ? `${pct(effect.offsetX ?? 6, scene.height).replace('%', 'cqh')} ${pct(effect.offsetY ?? 6, scene.height).replace('%', 'cqh')} ${effectSize} ${effectColor}`
                : 'none';
          return `<div class="mirror-scene-element" style="${base}"><div class="mirror-scene-text" style="font-family:${escapeHtml(style.fontFamily || 'sans-serif')};font-size:${pct(style.fontSize, scene.height).replace('%', 'cqh')};font-weight:${Number(style.fontWeight || 400)};font-style:${style.italic ? 'italic' : 'normal'};text-decoration:${style.underline ? 'underline' : 'none'};color:${escapeHtml(style.color || '#fff')};text-align:${align};line-height:${Number(style.lineHeight || 1.2)};letter-spacing:${Number(style.letterSpacing || 0)}px;align-items:${vertical};text-shadow:${textShadow};">${escapeHtml(element.text || '')}</div></div>`;
        }
        if (element.type === 'image') {
          const fit = ['contain', 'cover', 'fill'].includes(element.fit) ? element.fit : 'cover';
          return `<div class="mirror-scene-element" style="${base}"><img src="/api/media/${encodeURIComponent(element.mediaId)}" style="object-fit:${fit};object-position:${Number(element.focalPoint?.x ?? .5) * 100}% ${Number(element.focalPoint?.y ?? .5) * 100}%;" alt="" /></div>`;
        }
        if (element.type === 'shape') {
          const radius = element.shape === 'ellipse'
            ? '50%'
            : element.shape === 'rectangle'
              ? pct(element.cornerRadius ?? 0, scene.height).replace('%', 'cqh')
              : '0';
          const clip = element.shape === 'triangle'
            ? 'polygon(50% 0,100% 100%,0 100%)'
            : 'none';
          const fill = element.shape === 'line' || element.fillMode === 'outline'
            ? 'transparent'
            : escapeHtml(element.fill || 'transparent');
          const border = element.fillMode === 'outline'
            ? `border:${pct(element.stroke?.width ?? 4, scene.height).replace('%', 'cqh')} solid ${escapeHtml(element.stroke?.color || element.fill || '#fff')};`
            : '';
          const line = element.shape === 'line'
            ? `<span style="position:absolute;left:0;right:0;top:50%;height:${pct(element.stroke?.width ?? 4, scene.height).replace('%', 'cqh')};transform:translateY(-50%);background:${escapeHtml(element.stroke?.color || element.fill || '#fff')};"></span>`
            : '';
          return `<div class="mirror-scene-element" style="${base}background:${fill};border-radius:${radius};clip-path:${clip};${border}">${line}</div>`;
        }
        return '';
      }).join('');
      mirror.innerHTML = `<div class="mirror-scene" style="${backgroundStyle}">${elements}</div>`;
    }

    // Wayfinding (reference-only scripture, spec section 1): books further from the current
    // one shrink and fade, one fade level per book regardless of length.
    function bookStyle(distance) {
      const level = Math.abs(distance);
      const sizes = ['font-size:clamp(11px,3vw,20px);', 'font-size:clamp(9px,2vw,14px);'];
      const opacities = [0.55, 0.3];
      const size = sizes[level - 1] || sizes[sizes.length - 1];
      const opacity = opacities[level - 1] ?? opacities[opacities.length - 1];
      return `${size}opacity:${opacity};`;
    }

    async function poll() {
      try {
        const res = await fetch('/api/state');
        if (res.status === 401) {
          document.body.innerHTML = '<div style="padding:24px;text-align:center;color:#9aa0ac">This device is no longer paired. Ask the operator to re-pair it in Settings.</div>';
          return;
        }
        const state = await res.json();
        document.getElementById('connection-dot').classList.remove('offline');
        document.getElementById('device-name').textContent = state.deviceName;

        document.getElementById('live-blink').style.visibility = state.isPresenting ? 'visible' : 'hidden';
        document.getElementById('live-status-text').textContent = state.isPresenting
          ? `LIVE${state.content ? ': ' + state.content.itemLabel : ''}`
          : 'Not presenting';

        renderMirror(state.isPresenting, state.content);

        document.getElementById('transport-row').style.display = state.accessLevel === 'view-only' ? 'none' : 'flex';
        document.getElementById('present-btn').style.display = state.accessLevel === 'full-control' ? 'block' : 'none';
        document.getElementById('access-note').textContent = ACCESS_LABELS[state.accessLevel] || '';
      } catch (e) {
        document.getElementById('connection-dot').classList.add('offline');
      }
    }

    poll();
    setInterval(poll, 1200);
  </script>
</body>
</html>
