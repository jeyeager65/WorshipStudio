name: CI

on:
  pull_request:
  # `dev` as well as `main`: day-to-day work is committed straight to dev (a feature branch per
  # change is ceremony with no second reviewer), so without this every commit between releases
  # would go unchecked until the dev -> main pull request — later and in a much larger batch than
  # today's direct-to-main pushes are checked. main stays listed for the release merge and for
  # anything a flyup puts there.
  push:
    branches: [main, dev]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test:unit

      - run: pnpm build

      # The Remote Control mirror's own small Vue bundle (src-remote/) — a separate build
      # target from the main app above, embedded into the Rust binary via rust-embed at
      # `tauri build` time (see tauri.conf.json's beforeBuildCommand). Neither this job nor
      # the rust job below actually runs a full `tauri build`, so without this step a broken
      # build:remote (a bad tsconfig.remote.json include, a stray import outside its allowed
      # scope, etc.) would pass CI on every PR and only surface when release.yml's
      # tauri-action cuts an actual release.
      - run: pnpm build:remote

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # remote_server.rs embeds the Remote Control mirror's built Vue bundle via
      # #[derive(RustEmbed)] — that macro requires dist-remote/ to physically exist on disk at
      # *compile* time (not just at runtime), so every cargo command below, including plain
      # `cargo fmt`/`clippy`/`test`, fails to even build the crate without it. A fresh checkout
      # on this job's own runner never produces it otherwise (dist-remote/ is gitignored, and
      # this job never runs the frontend build) — duplicated here rather than depending on the
      # frontend job's own build:remote output via upload/download-artifact so the two jobs stay
      # parallel instead of serializing rust behind frontend.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:remote

      # Same story as build:remote above, for a second RustEmbed target: lib.rs's HelpAssets
      # embeds the built VitePress help site from src-tauri/resources/help/ (also gitignored,
      # also produced by a pnpm script tauri.conf.json's beforeDevCommand/beforeBuildCommand
      # already run — just not on this job's own fresh checkout). Missing this doesn't fail
      # fmt/clippy the way a real formatting/lint issue would — it fails to compile the crate
      # at all, so every cargo step below reports as a clippy/test failure with no obvious
      # connection to the actual cause.
      - run: pnpm docs:build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
