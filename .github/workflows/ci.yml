name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test:unit

      - run: pnpm build

      # The Remote Control mirror's own small Vue bundle (src-remote/) — a separate build
      # target from the main app above, embedded into the Rust binary via rust-embed at
      # `tauri build` time (see tauri.conf.json's beforeBuildCommand). Neither this job nor
      # the rust job below actually runs a full `tauri build`, so without this step a broken
      # build:remote (a bad tsconfig.remote.json include, a stray import outside its allowed
      # scope, etc.) would pass CI on every PR and only surface when release.yml's
      # tauri-action cuts an actual release.
      - run: pnpm build:remote

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
