name: CI

on:
  pull_request:
  # `dev` as well as `main`: day-to-day work is committed straight to dev (a feature branch per
  # change is ceremony with no second reviewer), so without this every commit between releases
  # would go unchecked until the dev -> main pull request — later and in a much larger batch than
  # today's direct-to-main pushes are checked. main stays listed for the release merge and for
  # anything a flyup puts there.
  push:
    branches: [main, dev]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test:unit

      - run: pnpm build

      # The Remote Control mirror's own small Vue bundle (src-remote/) — a separate build
      # target from the main app above, embedded into the Rust binary via rust-embed at
      # `tauri build` time (see tauri.conf.json's beforeBuildCommand). Neither this job nor
      # the rust job below actually runs a full `tauri build`, so without this step a broken
      # build:remote (a bad tsconfig.remote.json include, a stray import outside its allowed
      # scope, etc.) would pass CI on every PR and only surface when release.yml's
      # tauri-action cuts an actual release.
      - run: pnpm build:remote

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # remote_server.rs embeds the Remote Control mirror's built Vue bundle via
      # #[derive(RustEmbed)] — that macro requires dist-remote/ to physically exist on disk at
      # *compile* time (not just at runtime), so every cargo command below, including plain
      # `cargo fmt`/`clippy`/`test`, fails to even build the crate without it. A fresh checkout
      # on this job's own runner never produces it otherwise (dist-remote/ is gitignored, and
      # this job never runs the frontend build) — duplicated here rather than depending on the
      # frontend job's own build:remote output via upload/download-artifact so the two jobs stay
      # parallel instead of serializing rust behind frontend.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:remote

      # Same story as build:remote above, for a second RustEmbed target: lib.rs's HelpAssets
      # embeds the built VitePress help site from src-tauri/resources/help/ (also gitignored,
      # also produced by a pnpm script tauri.conf.json's beforeDevCommand/beforeBuildCommand
      # already run — just not on this job's own fresh checkout). Missing this doesn't fail
      # fmt/clippy the way a real formatting/lint issue would — it fails to compile the crate
      # at all, so every cargo step below reports as a clippy/test failure with no obvious
      # connection to the actual cause.
      - run: pnpm docs:build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The dev deployment (notes/dev-workflow-plan.md): every push to `dev` publishes the combined
  # static site — help site at the root, web/tablet app at /app/ — to its own Cloudflare Workers
  # origin, so the build can be opened on a real tablet before it reaches anyone's church.
  #
  # `needs` the two check jobs on purpose: a dev URL serving a build that does not compile is
  # worse than no dev URL, since the point of it is to trust what you are testing.
  #
  # Built here rather than by Cloudflare's own Git integration. The same build already runs in
  # this file, on this runner, with this Node version — letting Cloudflare rebuild it from the
  # dashboard would mean a second build configuration to keep in step, and a class of "works in
  # CI, fails on their container" problems with nothing to gain.
  deploy-dev:
    needs: [frontend, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Assembles ./pages — the directory wrangler.jsonc publishes. Base paths default to the
      # root-served case, which is what this origin serves (unlike GitHub Pages, which nests
      # everything under /WorshipStudio/).
      - run: pnpm build:pages

      # `npx wrangler` rather than cloudflare/wrangler-action: the action installs wrangler with
      # whatever package manager the repo uses, and pnpm 10+ refuses to run a dependency's
      # postinstall without explicit approval — workerd has one, so the install exits 1 before
      # wrangler ever runs. The action also pins a wrangler old enough to predate the `assets`
      # config in wrangler.jsonc. npx sidesteps both, and pins the major version here.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
