name: Release

# Cutting a release: bump the version in package.json and src-tauri/Cargo.toml (tauri.conf.json
# reads its own version from package.json), commit, then `git tag vX.Y.Z && git push origin
# vX.Y.Z` — see notes/release-process.md.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # macOS dropped from the release matrix (decided August 9, 2026 — see
          # notes/release-process.md): no one runs live presentation from a Mac, and the web
          # build already covers Mac-based prep work. The Tauri config, signing rationale, and
          # install docs are left in place; add `- platform: macos-latest` back here if this
          # gets revisited.
    runs-on: ${{ matrix.platform }}
    # tauri-action creates/updates the GitHub Release and uploads build artifacts to it via
    # the REST API — needs write access, which the default GITHUB_TOKEN doesn't grant unless
    # a repo/org has changed its default workflow permissions from GitHub's read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Windows builds are signed with the self-signed certificate documented in
      # notes/release-process.md — imported here from secrets, never committed.
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          Remove-Item $pfxPath

          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERT_THUMBPRINT
                digestAlgorithm       = 'sha256'
                timestampUrl          = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path windows-signing.json -Value $signingConfig

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle/manifest (latest.json) tauri.conf.json's createUpdaterArtifacts
          # produces — a separate keypair from the Windows code-signing certificate above; see
          # notes/release-process.md's updater section for how it was generated. Unset for macOS
          # (not in this release matrix) is harmless — signing only runs where createUpdaterArtifacts
          # actually builds anything.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Worship Studio ${{ github.ref_name }}'
          # generateReleaseNotes pulls real "what changed" content from GitHub's Release Notes
          # API instead of a static placeholder — falls back to a plain commit list today (no
          # PRs yet) and gets richer (grouped by PR, New Contributors, etc.) automatically once
          # the project moves off direct-to-main commits post-1.0. releaseBody prepends to it.
          generateReleaseNotes: true
          releaseBody: |
            Windows builds are signed with a self-signed certificate, so Windows will show an
            "unrecognized publisher" warning on first install. See the Installation guide
            (https://jeyeager65.github.io/WorshipStudio/installation.html) for the one-time
            trust step, needed once per machine.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'windows-latest' && '--config windows-signing.json' || '' }}

  deploy-demo:
    # The project's public GitHub Pages site, republished on every release: the VitePress help
    # site (docs/) as the landing page at the root, and the web-only static demo (mock adapter,
    # no Tauri backend) nested at /app/ underneath it — see README's "static demo" note,
    # notes/release-process.md, and notes/help-system-plan.md.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_BASE_PATH: /WorshipStudio/app/

      - run: pnpm docs:build
        env:
          VITEPRESS_BASE_PATH: /WorshipStudio/

      - name: Assemble combined Pages site (help site at root, demo nested at /app/)
        run: |
          mkdir -p pages
          cp -r src-tauri/resources/help/. pages/
          mkdir -p pages/app
          cp -r dist/. pages/app/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - uses: actions/deploy-pages@v5
        id: deployment
